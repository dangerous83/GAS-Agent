name: Deploy to Vercel

# Deploys the site to Vercel on every push.
#   main          -> production URL
#   other branches -> preview URL
#
# Setup (one time): add a repository secret named VERCEL_TOKEN
# (create it at https://vercel.com/account/tokens).
# Optional secrets: VERCEL_SCOPE (team slug, for team accounts) and
# VERCEL_PROJECT_NAME (defaults to "gas-agent"). The project is created
# on the first run if it does not exist yet.

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
      VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}
    steps:
      - name: Check for Vercel token
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning title=Vercel deploy skipped::Add a repository secret named VERCEL_TOKEN (Settings > Secrets and variables > Actions) to turn on automatic Vercel deploys."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20

      - name: Install Vercel CLI
        if: steps.check.outputs.skip != 'true'
        run: npm install --global vercel@latest

      - name: Link project
        if: steps.check.outputs.skip != 'true'
        run: |
          SCOPE_ARG=""
          [ -n "$VERCEL_SCOPE" ] && SCOPE_ARG="--scope $VERCEL_SCOPE"
          vercel link --yes --project "${VERCEL_PROJECT_NAME:-gas-agent}" $SCOPE_ARG --token "$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        if: steps.check.outputs.skip != 'true'
        run: |
          SCOPE_ARG=""
          [ -n "$VERCEL_SCOPE" ] && SCOPE_ARG="--scope $VERCEL_SCOPE"
          PROD_ARG=""
          [ "$GITHUB_REF_NAME" = "main" ] && PROD_ARG="--prod"
          URL=$(vercel deploy $PROD_ARG --yes $SCOPE_ARG --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to Vercel"
            echo ""
            echo "- Branch: \`$GITHUB_REF_NAME\` (${PROD_ARG:+production}${PROD_ARG:-preview})"
            echo "- URL: $URL"
            echo "- Interfaces: $URL/#glass · $URL/#clay · $URL/#cyber · $URL/#nebula · $URL/#gold · $URL/#matte"
          } >> "$GITHUB_STEP_SUMMARY"
